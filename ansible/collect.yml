---
# Pull each host's local database as a consistent JSON snapshot to the control
# node (into {{ commatrix_local_dir }}/snapshots/<host>.json).
#
#   ansible-playbook -i inventory.ini collect.yml
#
# We use 'commatrix export' (a read-only, WAL-consistent dump) instead of copying
# the raw .db file, so no locking/corruption concerns.
- name: Collect commatrix snapshots
  hosts: commatrix_hosts
  become: true
  gather_facts: false

  vars:
    remote_snapshot: "/var/lib/commatrix/snapshots/{{ inventory_hostname }}.json"

  tasks:
    - name: Export a JSON snapshot on the host
      ansible.builtin.command:
        # argv form: the snapshot path is inventory-derived and must never be
        # concatenated into a shell string (SEC-037).
        argv:
          - /usr/bin/commatrix
          - export
          - -o
          - "{{ remote_snapshot }}"
      # Writing a snapshot does change state on the host, but it is the whole
      # point of the task rather than a drift signal; keep it explicit.
      changed_when: true

    - name: Ensure local snapshot directory exists
      ansible.builtin.file:
        path: "{{ commatrix_local_dir }}/snapshots"
        state: directory
        mode: "0750"
      delegate_to: localhost
      become: false
      run_once: true  # noqa: run-once[task] - default linear strategy

    - name: Fetch snapshot to the control node
      ansible.builtin.fetch:
        src: "{{ remote_snapshot }}"
        dest: "{{ commatrix_local_dir }}/snapshots/{{ inventory_hostname }}.json"
        flat: true


# Windows hosts (WinRM): identical snapshot JSON contract -> merged into the same
# central DB by report.yml. Skips cleanly if the group is empty.
- name: Collect commatrix snapshots (Windows)
  hosts: commatrix_windows
  gather_facts: false

  vars:
    remote_snapshot: 'C:\ProgramData\commatrix\snapshots\{{ inventory_hostname }}.json'

  tasks:
    # SEC-037: win_shell runs the interpolated string through PowerShell, so a
    # host name containing a quote or a semicolon becomes command execution on
    # the target. win_command with an argv list does not go near a shell.
    - name: Export a JSON snapshot on the Windows host
      ansible.windows.win_command:
        argv:
          - python
          - -m
          - commatrix
          - export
          - -o
          - "{{ remote_snapshot }}"
      changed_when: true

    - name: Ensure local snapshot directory exists
      ansible.builtin.file:
        path: "{{ commatrix_local_dir }}/snapshots"
        state: directory
        mode: "0750"
      delegate_to: localhost
      become: false
      run_once: true  # noqa: run-once[task] - default linear strategy

    # There is no ansible.windows.win_fetch module and there never has been --
    # this play could not run at all, so Windows snapshots were never collected.
    # ansible.builtin.fetch is the right module for pulling a file off a
    # Windows target (it goes through the collection's slurp action), and it is
    # what the Linux play above already uses.
    - name: Fetch Windows snapshot to the control node
      ansible.builtin.fetch:
        src: "{{ remote_snapshot }}"
        dest: "{{ commatrix_local_dir }}/snapshots/{{ inventory_hostname }}.json"
        flat: true
