name: Release

# Builds deployment packages and attaches them to a GitHub Release.
# Triggers:
#   - push of tags v1.2.3 or 1.2.3
#   - publishing a release in the GitHub UI (even without a v* tag)
#   - manual "Run workflow" with version X.Y.Z
on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]+.[0-9]+.[0-9]+"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (X.Y.Z) — also the existing release tag to update"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            tag="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Semver without optional leading "v"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building packages for tag=$tag version=$version"

  sdist-wheel:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - run: python packaging/version.py set "${{ needs.version.outputs.version }}"
      - run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: { name: dist, path: dist/* }

  docker:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    # SEC-042: id-token is what lets buildx attach SLSA provenance and lets
    # cosign sign keylessly against Sigstore; attestations:write publishes the
    # provenance attestation alongside the image.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.tag }}
      - run: python packaging/version.py set "${{ needs.version.outputs.version }}"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # SEC-042: the image shipped with provenance and SBOM explicitly
          # switched off, so nothing downstream could establish what was in it
          # or which commit and workflow produced it. mode=max records the
          # full build definition and materials.
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/commatrix:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/commatrix:latest

      # SEC-041/042: a keyless (OIDC) signature over the image digest, so a
      # consumer can verify the image came from this repository's release
      # workflow and not from anyone who can push to the registry.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Sign the container image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/commatrix
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verification instructions
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/commatrix
        run: |
          echo "Verify with:"
          echo "  cosign verify ${IMAGE}@${DIGEST} \\"
          echo "    --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
          echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"
          echo "  cosign verify-attestation --type slsaprovenance ${IMAGE}@${DIGEST} \\"
          echo "    --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
          echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"

  appimage:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libfuse2
      - run: python packaging/version.py set "${{ needs.version.outputs.version }}"
      - run: bash packaging/appimage/build-appimage.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: { name: appimage, path: "*.AppImage" }

  msi:
    needs: version
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with: { dotnet-version: "8.0.x" }
      - run: python packaging/version.py set "${{ needs.version.outputs.version }}"
      - run: powershell -ExecutionPolicy Bypass -File packaging/windows/build_msi.ps1 -Version "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: error

  snap:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.tag }}
      - run: python3 packaging/version.py set "${{ needs.version.outputs.version }}"
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79  # v1
        id: snapcraft
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: { name: snap, path: "*.snap" }

  flatpak:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-23.08
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.tag }}
      - uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb  # v6
        with:
          bundle: commatrix.flatpak
          manifest-path: packaging/flatpak/io.github.fedurca.commatrix.yaml
          cache-key: flatpak-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: { name: flatpak, path: commatrix.flatpak }

  sbom:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.tag }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: commatrix-${{ needs.version.outputs.version }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: { name: sbom, path: "*.cdx.json" }

  release:
    needs: [version, sdist-wheel, docker, appimage, msi, snap, flatpak, sbom]
    if: ${{ always() && needs.version.result == 'success' && needs.sdist-wheel.result == 'success' }}
    runs-on: ubuntu-latest
    # SEC-041: id-token for keyless signing, attestations for the build
    # provenance of the release artifacts.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: "{dist,appimage,msi,snap,flatpak,sbom}"
          merge-multiple: true
          path: artifacts
          # Optional package jobs may be missing (continue-on-error).
        continue-on-error: true
      - name: Collect and checksum
        run: |
          mkdir -p release
          find artifacts -type f \( \
              -name '*.AppImage' -o -name '*.msi' -o -name '*.snap' \
              -o -name '*.flatpak' -o -name '*.whl' -o -name '*.tar.gz' \
              -o -name '*.cdx.json' \
            \) -exec cp -n {} release/ \; 2>/dev/null || true
          n=$(find release -type f | wc -l)
          echo "Collected $n artifact file(s):"
          ls -la release || true
          if [ "$n" -eq 0 ]; then
            echo "No package artifacts to attach" >&2
            exit 1
          fi
          cd release && sha256sum * > SHA256SUMS

      # Every packaging job is continue-on-error, so one of them failing does
      # not stop the release -- a flaky snapcraft run should not block a
      # security fix from shipping. What it must not do is fail *silently*:
      # without this, a broken MSI job (say, the SEC-033 signature check
      # rejecting the embedded interpreter) publishes a release with no Windows
      # package and nothing anywhere says so. Name what is missing, in the job
      # summary, as a workflow annotation, and in the release notes themselves.
      - name: Report which packages are present
        id: manifest
        run: |
          set -u
          missing=""
          present=""
          check() {  # <label> <glob>
            if compgen -G "release/$2" > /dev/null; then
              present="$present- $1\n"
            else
              missing="$missing- **$1** — the \`$3\` job did not produce it\n"
            fi
          }
          check "Python wheel"   "*.whl"      sdist-wheel
          check "Source archive" "*.tar.gz"   sdist-wheel
          check "Windows MSI"    "*.msi"      msi
          check "AppImage"       "*.AppImage" appimage
          check "Snap"           "*.snap"     snap
          check "Flatpak"        "*.flatpak"  flatpak
          check "SBOM"           "*.cdx.json" sbom

          {
            echo "## Packages"
            echo
            printf "%b" "$present"
            if [ -n "$missing" ]; then
              echo
              echo "### Missing from this release"
              echo
              printf "%b" "$missing"
              echo
              echo "These jobs are non-blocking, so the release still published."
              echo "Check the workflow run before treating this as complete."
            fi
          } > release-notes.md

          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$missing" ]; then
            printf '::warning::release is missing packages:\n%b' "$missing"
          fi

      # SEC-041: checksums establish integrity against accidental corruption,
      # not authenticity -- anyone who can edit the release can replace both
      # the artifact and its line in SHA256SUMS. A keyless Sigstore signature
      # over SHA256SUMS binds the whole set to this workflow, on this
      # repository, at this commit.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Sign the checksum manifest
        working-directory: release
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS
          cat > SHA256SUMS.verify.md <<'VERIFY'
          # Verifying this release

          1. Check the artifact hashes:

                 sha256sum -c SHA256SUMS

          2. Check that SHA256SUMS itself came from this repository's release
             workflow (needs https://github.com/sigstore/cosign):

                 cosign verify-blob SHA256SUMS \
                   --signature SHA256SUMS.sig \
                   --certificate SHA256SUMS.pem \
                   --certificate-identity-regexp '^https://github.com/REPOSITORY/' \
                   --certificate-oidc-issuer https://token.actions.githubusercontent.com
          VERIFY
          sed -i "s|REPOSITORY|${GITHUB_REPOSITORY}|" SHA256SUMS.verify.md

      # Build provenance for every attached artifact (SEC-042).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1
        with:
          subject-path: |
            release/*.whl
            release/*.tar.gz
            release/*.msi
            release/*.AppImage
            release/*.snap
            release/*.flatpak

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: release/*
          body_path: release-notes.md
          fail_on_unmatched_files: false
          generate_release_notes: ${{ github.event_name != 'release' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
