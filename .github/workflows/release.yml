name: Release

# Builds deployment packages and attaches them to a GitHub Release.
# Triggers:
#   - push of tags v1.2.3 or 1.2.3
#   - publishing a release in the GitHub UI (even without a v* tag)
#   - manual "Run workflow" with version X.Y.Z
on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]+.[0-9]+.[0-9]+"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (X.Y.Z) — also the existing release tag to update"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            tag="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Semver without optional leading "v"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building packages for tag=$tag version=$version"

  sdist-wheel:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.tag }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python packaging/version.py set "${{ needs.version.outputs.version }}"
      - run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/* }

  docker:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    # SEC-042: id-token is what lets buildx attach SLSA provenance and lets
    # cosign sign keylessly against Sigstore; attestations:write publishes the
    # provenance attestation alongside the image.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.tag }}
      - run: python packaging/version.py set "${{ needs.version.outputs.version }}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # SEC-042: the image shipped with provenance and SBOM explicitly
          # switched off, so nothing downstream could establish what was in it
          # or which commit and workflow produced it. mode=max records the
          # full build definition and materials.
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/commatrix:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/commatrix:latest

      # SEC-041/042: a keyless (OIDC) signature over the image digest, so a
      # consumer can verify the image came from this repository's release
      # workflow and not from anyone who can push to the registry.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the container image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/commatrix
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verification instructions
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/commatrix
        run: |
          echo "Verify with:"
          echo "  cosign verify ${IMAGE}@${DIGEST} \\"
          echo "    --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
          echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"
          echo "  cosign verify-attestation --type slsaprovenance ${IMAGE}@${DIGEST} \\"
          echo "    --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
          echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"

  appimage:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libfuse2
      - run: python packaging/version.py set "${{ needs.version.outputs.version }}"
      - run: bash packaging/appimage/build-appimage.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: "*.AppImage" }

  msi:
    needs: version
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.tag }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: python packaging/version.py set "${{ needs.version.outputs.version }}"
      - run: powershell -ExecutionPolicy Bypass -File packaging/windows/build_msi.ps1 -Version "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: error

  snap:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.tag }}
      - run: python3 packaging/version.py set "${{ needs.version.outputs.version }}"
      - uses: snapcore/action-build@v1
        id: snapcraft
      - uses: actions/upload-artifact@v4
        with: { name: snap, path: "*.snap" }

  flatpak:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-23.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.tag }}
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: commatrix.flatpak
          manifest-path: packaging/flatpak/io.github.fedurca.commatrix.yaml
          cache-key: flatpak-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with: { name: flatpak, path: commatrix.flatpak }

  sbom:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.tag }}
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: commatrix-${{ needs.version.outputs.version }}.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: "*.cdx.json" }

  release:
    needs: [version, sdist-wheel, docker, appimage, msi, snap, flatpak, sbom]
    if: ${{ always() && needs.version.result == 'success' && needs.sdist-wheel.result == 'success' }}
    runs-on: ubuntu-latest
    # SEC-041: id-token for keyless signing, attestations for the build
    # provenance of the release artifacts.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "{dist,appimage,msi,snap,flatpak,sbom}"
          merge-multiple: true
          path: artifacts
          # Optional package jobs may be missing (continue-on-error).
        continue-on-error: true
      - name: Collect and checksum
        run: |
          mkdir -p release
          find artifacts -type f \( \
              -name '*.AppImage' -o -name '*.msi' -o -name '*.snap' \
              -o -name '*.flatpak' -o -name '*.whl' -o -name '*.tar.gz' \
              -o -name '*.cdx.json' \
            \) -exec cp -n {} release/ \; 2>/dev/null || true
          n=$(find release -type f | wc -l)
          echo "Collected $n artifact file(s):"
          ls -la release || true
          if [ "$n" -eq 0 ]; then
            echo "No package artifacts to attach" >&2
            exit 1
          fi
          cd release && sha256sum * > SHA256SUMS

      # SEC-041: checksums establish integrity against accidental corruption,
      # not authenticity -- anyone who can edit the release can replace both
      # the artifact and its line in SHA256SUMS. A keyless Sigstore signature
      # over SHA256SUMS binds the whole set to this workflow, on this
      # repository, at this commit.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the checksum manifest
        working-directory: release
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS
          cat > SHA256SUMS.verify.md <<'VERIFY'
          # Verifying this release

          1. Check the artifact hashes:

                 sha256sum -c SHA256SUMS

          2. Check that SHA256SUMS itself came from this repository's release
             workflow (needs https://github.com/sigstore/cosign):

                 cosign verify-blob SHA256SUMS \
                   --signature SHA256SUMS.sig \
                   --certificate SHA256SUMS.pem \
                   --certificate-identity-regexp '^https://github.com/REPOSITORY/' \
                   --certificate-oidc-issuer https://token.actions.githubusercontent.com
          VERIFY
          sed -i "s|REPOSITORY|${GITHUB_REPOSITORY}|" SHA256SUMS.verify.md

      # Build provenance for every attached artifact (SEC-042).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            release/*.whl
            release/*.tar.gz
            release/*.msi
            release/*.AppImage
            release/*.snap
            release/*.flatpak

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: release/*
          fail_on_unmatched_files: false
          generate_release_notes: ${{ github.event_name != 'release' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
