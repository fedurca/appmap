name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile (stdlib-only sanity)
        run: python -m compileall commatrix
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  test-windows:
    # Exercises the Windows platform backend (ctypes/winreg/socket) on a real
    # Windows host - closes the "integration only on Windows" gap.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Stamp version from git
        run: python packaging/version.py from-git
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: python-dist
          path: dist/*

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Generate CycloneDX + SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: commatrix.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom
          path: commatrix.cdx.json

  supply-chain-pins:
    # SEC-033/040/044: fails while any GitHub Action, the container base image
    # or the embedded Windows Python is referenced by a mutable name. The
    # resolver that produces the pins needs network access to api.github.com,
    # the registry and python.org, so it is run once by a human:
    #     python packaging/pin_supply_chain.py --write
    # This job only checks the result, offline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Check supply-chain pins
        run: python packaging/pin_supply_chain.py --check

  hardening:
    # The review deferred these to "verify on a real machine". Both tools run
    # offline (systemd-analyze security --offline= needs systemd v247+, ubuntu
    # -latest ships 255), so they run on every commit instead of once by hand:
    #   * visudo -cf over the sudoers drop-ins install-service.sh and
    #     install-lab-sudoers.sh generate;
    #   * systemd-analyze security over every shipped unit AND over the
    #     collector unit with each elevate-linux drop-in merged in, against a
    #     recorded per-unit exposure budget.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Tool versions
        run: |
          systemd-analyze --version | head -1
          visudo --version | head -1
      - name: sudoers + systemd unit review
        run: python packaging/check_hardening.py --report

  container-uid:
    # The image defaults to USER 65532 while `collect` typically runs as root,
    # so read-only commands hit a database directory they cannot write. That
    # broke every documented report/export invocation; this reproduces the
    # exact UID split without needing a Docker daemon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Build a database as root, read it as UID 65532
        run: |
          sudo mkdir -p /srv/cm && sudo chmod 0755 /srv/cm
          sudo python -m commatrix collect --allow-manual --iterations 1 \
            --database /srv/cm/c.db || true
          sudo python - <<'PY'
          from commatrix.store import Store, EdgeObservation
          s = Store('/srv/cm/c.db')
          s.upsert_host('h', {'hostname': 'h'})
          s.record_edge('h', EdgeObservation(
              proto='tcp', direction='inbound', local_ip='10.0.0.1',
              peer_ip='203.0.113.9', service_port=443, peer_class='external',
              snapshot_bytes=10, snapshot_packets=1, service_side='local'), now=100.0)
          s.close()
          PY
          sudo chmod 0644 /srv/cm/c.db
          sudo setpriv --reuid 65532 --regid 65532 --clear-groups \
            python -m commatrix report -f markdown --database /srv/cm/c.db

